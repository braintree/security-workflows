name: Code Scanning

on:
  workflow_call:
    inputs:
      language:
        description: 'Language to analyze with CodeQL'
        required: true
        type: string
      build-command:
        description: 'Optional application build command'
        required: false
        type: string
      filter-patterns:
        description: 'Optional comma-separated list of filter patterns'
        required: false
        type: string
      timeout-minutes:
        description: 'Optional override for larger builds'
        required: false
        default: 20
        type: number

permissions:
  security-events: write
  # required to fetch internal or private CodeQL packs
  packages: read
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  code-scanning:
    name: Code Scanning
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false

    steps:
      - name: Capture start time
        run: echo "start_time=$(date +%s)" >> $GITHUB_ENV
        shell: bash

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: ${{ inputs.language == 'javascript-typescript' || inputs.language == 'javascript' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
    
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-command != '' && 'manual' || 'none' }}
          config: |
            paths-ignore:
              - fixtures
              - spec
              - sorbet
              - linters
              - '**/test_*.rb'
            query-filters:
              - exclude:
                  id: js/disabling-certificate-validation
              - exclude:
                  id: py/hardcoded-credentials
              - exclude:
                  id: js/missing-rate-limiting
              - exclude:
                  id: py/request-without-cert-validation
              - exclude:
                  id: rb/request-without-cert-validation
              
      - name: Manual build 
        if: ${{ inputs.build-command != '' }}
        run: |
          {{ inputs.build-command }}

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ inputs.language }}"
          output: sarif-results
          upload: failure-only

      - name: Process & Upload SARIF
        uses: braintree/security-workflows/.github/actions/upload-sarif@main
        with:
          sarif_dir: ${{ steps.codeql.outputs.sarif-output }}
          filter_patterns: ${{ inputs.filter-patterns }}