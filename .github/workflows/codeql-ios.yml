name: CodeQL (iOS)
on:
  workflow_call:
    inputs:
      project:
        description: 'xcodebuild -project arg (e.g. Demo/Demo.xcodeproj). Use this OR workspace, not both.'
        required: false
        type: string
      workspace:
        description: 'xcodebuild -workspace arg. Deprecated as braintree_ios drops CocoaPods/.xcworkspace — leave empty for SPM-only builds.'
        required: false
        type: string
      scheme:
        description: 'xcodebuild scheme arg'
        required: true
        type: string
      filter-patterns:
        description: 'Optional comma-separated list of filter patterns'
        required: false
        type: string
      mac-runner-version:
        required: false
        type: string
        default: 'macos-14-xlarge'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  code-scanning:
    name: Code Scanning
    runs-on: ${{ inputs.mac-runner-version }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode Version
        run: |
          if [ "${{ inputs.mac-runner-version }}" == "macos-15-xlarge" ]; then
            VERSION="16.4.0"
          else
            VERSION="15.0.1"
          fi
          sudo xcode-select -switch /Applications/Xcode_${VERSION}.app

      # Input validation: Demo scheme + Demo.xcodeproj (SPM), or library-only scheme with no project/workspace
      - name: Validate inputs
        shell: python
        env:
          PROJECT: ${{ inputs.project }}
          SCHEME: ${{ inputs.scheme }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          import os, sys

          allowed_schemes = ("Demo", "BraintreeDropIn")  # allow library-only builds too
          # .xcworkspace values kept temporarily for back-compat during the CocoaPods->SPM
          # transition; remove once all callers have migrated off workspace-based builds.
          allowed_workspaces = ("BraintreeDropIn.xcworkspace", "Braintree.xcworkspace", "PopupBridge.xcworkspace", "", None)
          allowed_projects = ("Demo/Demo.xcodeproj", "Demo.xcodeproj", "BraintreeDropIn.xcodeproj", "PopupBridge.xcodeproj", "", None)

          project = os.getenv("PROJECT")
          scheme = os.getenv("SCHEME")
          workspace = os.getenv("WORKSPACE")

          if scheme not in allowed_schemes:
              raise SystemExit(f"Invalid scheme: {scheme}. Allowed: {allowed_schemes}")
          if workspace not in allowed_workspaces:
              raise SystemExit(f"Invalid workspace: {workspace}. Allowed: {allowed_workspaces}")
          if project not in allowed_projects:
              raise SystemExit(f"Invalid project: {project}. Allowed: {allowed_projects}")
          if project and workspace:
              raise SystemExit("Set only one of 'project' or 'workspace', not both.")

          print("Inputs validated successfully.")

      # Compute the xcodebuild target flag once, reused by resolve + build steps.
      # Empty when neither project nor workspace is set, which lets xcodebuild build
      # directly off the root Package.swift for library-only scheme scans.
      - name: Compute build target flag
        id: target
        run: |
          if [ -n "${{ inputs.workspace }}" ]; then
            echo "flag=-workspace ${{ inputs.workspace }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.project }}" ]; then
            echo "flag=-project ${{ inputs.project }}" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Force Swift version to 5.0 in Demo target
        run: |
          if [ -f "Demo/Demo.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/SWIFT_VERSION = 6.0;/SWIFT_VERSION = 5.0;/g' Demo/Demo.xcodeproj/project.pbxproj
          fi

      # Optional cache to speed SPM fetches
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ${{ github.workspace }}/DerivedData/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # 1) Resolve Swift packages for the SAME DerivedData/SourcePackages paths we will build with
      - name: Resolve Swift Packages (Xcode)
        run: |
          xcodebuild -resolvePackageDependencies \
            ${{ steps.target.outputs.flag }} \
            -scheme "${{ inputs.scheme }}" \
            -derivedDataPath "${{ github.workspace }}/DerivedData" \
            -clonedSourcePackagesDirPath SourcePackages

      # 2) Initialize CodeQL in manual mode (Swift requires a manual build in many cases)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: swift
          build-mode: manual

      # 3) Build under CodeQL so extraction happens
      - name: Build
        run: |
          if [ "${{ inputs.mac-runner-version }}" == "macos-15-xlarge" ]; then
            IPHONE_VERSION="iPhone 16"
          else
            IPHONE_VERSION="iPhone 15"
          fi

          args=(
            "-configuration Debug"
            "-scheme ${{ inputs.scheme }}"
            "-derivedDataPath '${GITHUB_WORKSPACE}/DerivedData'"
            "-clonedSourcePackagesDirPath SourcePackages"
            "-scmProvider system"
            "-sdk iphonesimulator"
            "-destination 'platform=iOS Simulator,name=${IPHONE_VERSION}'"
            "CODE_SIGN_IDENTITY="
            "CODESIGNING_REQUIRED=NO"
            "CODE_SIGNING_ALLOWED=NO"
            "${{ steps.target.outputs.flag }}"
            "clean"
            "build"
          )

          echo "xcodebuild ${args[*]}"
          eval "xcodebuild ${args[*]}"

      - name: Perform CodeQL Analysis
        id: codeql
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:swift"
          output: sarif-results
          upload: failure-only

      - name: Process & Upload SARIF
        uses: braintree/security-workflows/.github/actions/upload-sarif@main
        with:
          sarif_dir: ${{ steps.codeql.outputs.sarif-output }}
          filter_patterns: ${{ inputs['filter-patterns'] }}