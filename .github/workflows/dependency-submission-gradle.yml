name: Dependency Submission

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Optional Java version number'
        required: false
        default: 17
        type: number
      project-root:
        description: 'Optional path to the project root directory'
        required: false
        type: string
        default: './'

permissions:
  contents: write

jobs:
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
  
      - name: Generate and submit dependency graph
        id: dependabot
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          build-root-directory: ${{ inputs.project-root }}